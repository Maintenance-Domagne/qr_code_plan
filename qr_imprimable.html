<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>QR Codes Machines - PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#2563eb;
    --soft:#eef2ff;
    --shadow: 0 6px 18px rgba(16,24,40,0.06);
    --radius:12px;
  }
  html,body{
    height:100%;
    margin:0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
    color:#0f172a;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .page {
    max-width:1100px;
    margin:28px auto;
    padding:24px;
  }

  header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
  }
  h1{
    font-size:20px;
    margin:0;
    font-weight:700;
    color:#0b1220;
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
  }

  .actions {
    display:flex;
    gap:10px;
    align-items:center;
  }
  .btn {
    background:linear-gradient(90deg,var(--accent),#1e40af);
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(37,99,235,0.15);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn.ghost{
    background:transparent;
    color:var(--accent);
    border:1px solid rgba(37,99,235,0.12);
    box-shadow:none;
  }
  .grid {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(1,1fr); } }

  .machine {
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    display:flex;
    gap:12px;
    align-items:flex-start;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .machine:hover{
    transform:translateY(-6px);
    box-shadow: 0 14px 36px rgba(15,23,42,0.08);
  }
  .left{
    width:120px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .qr-wrap{
    background:var(--soft);
    padding:10px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    box-sizing:border-box;
  }
  .qr-wrap canvas{ display:block; width:96px !important; height:96px !important; }

  .machine-title{
    margin-top:8px;
    font-weight:700;
    font-size:13px;
    color:#0b1220;
    text-align:center;
  }
  .machine-meta{
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
    text-align:center;
  }

  .right{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .files-list{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .file{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:8px;
    transition:background .12s ease;
    font-size:13px;
    color:#0b1220;
  }
  .file small{
    color:var(--muted);
    font-size:12px;
  }
  .file:hover{
    background:linear-gradient(90deg, rgba(37,99,235,0.04), rgba(37,99,235,0.02));
  }
  .file a{
    color:inherit;
    text-decoration:none;
  }
  .file .icon{
    width:34px;
    height:34px;
    border-radius:6px;
    background:linear-gradient(180deg, rgba(37,99,235,0.06), rgba(37,99,235,0.02));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-weight:700;
    font-size:13px;
    flex-shrink:0;
  }

  footer{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* Print */
  @media print {
    body { background: white; }
    header, .actions, footer { display:none; }
    .page { width:100%; margin:0; padding:0; }
    .grid{ grid-template-columns:repeat(2,1fr); gap:6px; }
    .machine{ box-shadow:none; border:1px solid #eee; }
    .left{ width:110px; }
  }

  /* small util */
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>QR Codes Machines — Embouteillage Ligne A</h1>
        <div class="subtitle">Cartes imprimables contenant QR, nom machine et documents utiles</div>
      </div>
      <div class="actions">
        <button id="exportPDF" class="btn">📄 Exporter en PDF</button>
        <button id="regenerate" class="btn ghost">🔁 Régénérer</button>
      </div>
    </header>

    <main id="container" class="grid" aria-live="polite"></main>

    <footer>
      Généré par <strong>Maintenance-Domagne</strong> — URL: <span class="muted">https://maintenance-domagne.github.io/qr_code_plan/</span>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
  // === Données complètes (inchangées) ===
  const machinesData = {
    "depalettiseur": {
        "label": "1- Dépalettiseur",
        "Schéma_électrique": [
      {
        "name": "Schéma électrique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Schéma_électrique/B_C22077ABE_15-03-2024_SB - SCHÉMAS ÉLECTRIQUE.pdf"
      }
    ],
    "Schéma_pneumatique": [
      {
        "name": "Schéma pneumatique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Schéma_pneumatique/C_C22077ABE - SCHEMA PNEUMATIQUE.pdf"
      }
    ],
    "Guide_technique_et_plans_mécanique": [
      {
        "name": "Manuel d'entretien et plan mécanique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Plans_mécanique/Plan mecanique.pdf"
      }
    ],
    "Liste de pièces machine": [
      {
        "name": "Pieces détachées en stock",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Liste_pièces/EXPORT_PIECE_MASPACK.pdf"
      }
    ]
    },
    "decaisseuse": {
        "label": "2- Décaisseuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/2- Décaisseuse/Schéma_électrique/Schéma électrique décaisseuse.pdf"
        }]
    },
    "laveuse": {
        "label": "4- Laveuse",
        "Schéma_électrique_p1_69": [{
            "name": "Schéma électrique page 1 à 69",
            "file": "Embouteillage_ligne_A/4- Laveuse/Schéma_électrique/Schéma électrique page 1-69.pdf"
        }],
        "Schéma_électrique_p70_140": [{
            "name": "Schéma électrique page 70 à 140",
            "file": "Embouteillage_ligne_A/4- Laveuse/Schéma_électrique/Schéma électrique page 70-140.pdf"
        }]
    },
    "rinçeuse": {
        "label": "6- Rinçeuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/6- Rinçeuse/Schéma_électrique/Plan élec Rinceuse 2015pdf.pdf"
        }]
    },
    "soutireuse": {
        "label": "7- Soutireuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/7- Soutireuse/Schéma_électrique/Schéma électrique soutireuse.pdf"
        }]
    },
    "boucheuse": {
        "label": "9- Boucheuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique boucheuse",
            "file": "Embouteillage_ligne_A/9- Boucheuse/Schéma_électrique/Schéma électrique boucheuse.pdf"
        }]
    },
    "visseuse_alu": {
        "label": "10- Visseuse alu",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/10- Visseuse alu/Schéma_électrique/Schéma électrique Visseuse alu.pdf"
        }]
    },
    "museleuse": {
        "label": "11- Museleuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/11- Museleuse/Schéma_électrique/Schéma électrique museleuse.pdf"
        }]
    },
    "encaisseuse": {
        "label": "16- Encaisseuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/16- Encaisseuse/Schéma_électrique/ECLOR_ENCAISSEUSE BOUTEILLES_IND01.pdf"
        }]
    },
    "encartonneuse": {
        "label": "19- Encartonneuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/19- Encartonneuse/Schéma_électrique/Schéma électrique OCME.pdf"
        }]
    },
    "palettiseur": {
        "label": "21- Palettiseur",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/21- Palettiseur/Schéma_électrique/Schéma élec.pdf"
        }]
    },
    "filmeuse": {
        "label": "22- Filmeuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/22- Filmeuse/Schéma_électrique/Schéma électrique filmeuse.pdf"
        }]
    }
  };

  // Générer QR asynchrone
  function generateQRCode(container, text, size = 96) {
    return new Promise((resolve) => {
      container.innerHTML = "";
      const q = new QRCode(container, {
        text: text,
        width: size,
        height: size,
        correctLevel: QRCode.CorrectLevel.M
      });
      // timeout pour s'assurer que le canvas est prêt
      setTimeout(() => resolve(q), 150);
    });
  }

  // Affichage
  function displayMachines() {
    const container = document.getElementById("container");
    container.innerHTML = "";
    Object.keys(machinesData).forEach(id => {
      const machine = machinesData[id];
      const machineURL = `https://maintenance-domagne.github.io/qr_code_plan/index.html?machine=${id}`;

      const el = document.createElement("article");
      el.className = "machine";

      const left = document.createElement("div");
      left.className = "left";

      const qrWrap = document.createElement("div");
      qrWrap.className = "qr-wrap";
      left.appendChild(qrWrap);

      const title = document.createElement("div");
      title.className = "machine-title";
      title.textContent = machine.label;
      left.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "machine-meta";
      meta.textContent = id;
      left.appendChild(meta);

      const right = document.createElement("div");
      right.className = "right";

      const filesList = document.createElement("ul");
      filesList.className = "files-list";

      Object.keys(machine).forEach(key => {
        if (key !== "label") {
          machine[key].forEach(item => {
            const li = document.createElement("li");
            const f = document.createElement("div");
            f.className = "file";

            const icon = document.createElement("div");
            icon.className = "icon";
            // Première lettre en majuscule pour l'icône
            icon.textContent = (item.name || "?").trim().charAt(0).toUpperCase();

            const info = document.createElement("div");
            const a = document.createElement("a");
            a.href = item.file;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.name;

            const small = document.createElement("small");
            small.textContent = item.file;

            info.appendChild(a);
            info.appendChild(document.createElement("div")).appendChild(small);
            // small is nested; fix DOM:
            info.lastChild.style.marginTop = "4px";
            info.lastChild.style.color = "#6b7280";
            info.lastChild.style.fontSize = "12px";

            f.appendChild(icon);
            f.appendChild(info);
            li.appendChild(f);
            filesList.appendChild(li);
          });
        }
      });

      right.appendChild(filesList);
      el.appendChild(left);
      el.appendChild(right);
      container.appendChild(el);

      // generate QR
      generateQRCode(qrWrap, machineURL, 96).then(() => {
        // append a small url under QR
        const u = document.createElement("div");
        u.className = "muted";
        u.style.marginTop = "8px";
        u.style.textAlign = "center";
        u.textContent = new URL(machineURL).pathname + new URLSearchParams(new URL(machineURL).search).toString().replace(/^/, '?');
        left.appendChild(u);
      });
    });
  }

  // Export PDF
  async function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "p" });

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const cardW = (pageW - margin * 3) / 2;
    const cardH = 90;
    const titleH = 10;
    const qrSize = 38;

    const ids = Object.keys(machinesData);
    let idx = 0;

    for (let i = 0; i < ids.length; i++) {
      if (idx > 0 && idx % 4 === 0) {
        pdf.addPage();
        idx = 0;
      }
      const col = idx % 2;
      const row = Math.floor(idx / 2);

      const x = margin + col * (cardW + margin);
      const y = margin + row * (cardH + margin);

      const id = ids[i];
      const machine = machinesData[id];
      const machineURL = `https://maintenance-domagne.github.io/qr_code_plan/index.html?machine=${id}`;

      // card background
      pdf.setDrawColor(220);
      pdf.setFillColor(255,255,255);
      pdf.roundedRect(x, y, cardW, cardH, 6, 6, "F");

      // title band
      pdf.setFillColor(244,246,255);
      pdf.roundedRect(x, y, cardW, titleH, 6, 6, "F");
      pdf.setFontSize(11);
      pdf.setFont("helvetica", "bold");
      pdf.setTextColor(14,20,32);
      pdf.text(machine.label, x + 6, y + 7);

      // QR generation in DOM to capture canvas
      const temp = document.createElement("div");
      temp.style.position = "absolute";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      await generateQRCode(temp, machineURL, 256);
      const canvas = temp.querySelector("canvas");
      if (canvas) {
        const img = canvas.toDataURL("image/png");
        pdf.addImage(img, "PNG", x + 6, y + titleH + 6, qrSize, qrSize);
      }
      document.body.removeChild(temp);

      // URL printed small
      pdf.setFontSize(8);
      pdf.setTextColor(100);
      pdf.text(machineURL, x + 6 + qrSize + 4, y + titleH + 10, { maxWidth: cardW - qrSize - 20 });

      // file list
      pdf.setFontSize(9);
      pdf.setTextColor(35);
      let tY = y + titleH + qrSize + 10;
      const maxWidth = cardW - 12;
      Object.keys(machine).forEach(key => {
        if (key !== "label") {
          machine[key].forEach(item => {
            const lines = pdf.splitTextToSize("• " + item.name, maxWidth);
            pdf.text(lines, x + 6, tY);
            tY += lines.length * 5;
          });
        }
      });

      idx++;
    }

    pdf.save("QR_Codes_Machines_Ligne_A.pdf");
  }

  document.addEventListener("DOMContentLoaded", () => {
    displayMachines();

    document.getElementById("exportPDF").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      const orig = btn.innerHTML;
      try {
        btn.textContent = "⏳ Génération...";
        btn.disabled = true;
        await exportToPDF();
        btn.textContent = "✅ PDF prêt";
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 1800);
      } catch (err) {
        console.error(err);
        btn.textContent = "❌ Erreur";
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 1800);
      }
    });

    document.getElementById("regenerate").addEventListener("click", () => {
      displayMachines();
    });
  });
  </script>
</body>
</html>
