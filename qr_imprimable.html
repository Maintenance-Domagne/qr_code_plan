<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>QR Codes Machines - PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: linear-gradient(135deg, #fef9f3 0%, #f5ede4 50%, #ebe3da 100%);
    --card:#fffbf7;
    --muted:#7d6d62;
    --accent:#d4845c;
    --accent-light:#e5a574;
    --soft:#faf3ed;
    --shadow: 0 8px 24px rgba(212, 132, 92, 0.12);
    --radius:16px;
    --border:#e8ddd2;
  }
  html,body{
    height:100%;
    margin:0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: var(--bg);
    color:#3d3530;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .page {
    max-width:1100px;
    margin:32px auto;
    padding:28px;
  }

  header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:32px;
    background: rgba(255, 251, 247, 0.8);
    backdrop-filter: blur(10px);
    padding: 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  h1{
    font-size:24px;
    margin:0;
    font-weight:700;
    color:#3d3530;
    background: linear-gradient(135deg, #d4845c, #8b5a3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    margin-top: 6px;
  }

  .actions {
    display:flex;
    gap:12px;
    align-items:center;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(212, 132, 92, 0.25);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: all 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(212, 132, 92, 0.35);
  }
  .btn.ghost{
    background:transparent;
    color:var(--accent);
    border:2px solid var(--accent);
    box-shadow:none;
  }
  .btn.ghost:hover {
    background: rgba(212, 132, 92, 0.08);
  }
  
  .grid {
      display:flex;
      flex-direction:column;
      gap:24px;
  }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(1,1fr); } }

  .machine {
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    display:flex;
    gap:16px;
    align-items:flex-start;
    border: 1px solid var(--border);
    transition: all 0.3s ease;
  }
  .machine:hover{
    transform:translateY(-8px);
    box-shadow: 0 16px 40px rgba(212, 132, 92, 0.18);
    border-color: var(--accent-light);
  }
  .left{
    width:130px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .qr-wrap{
    background: linear-gradient(135deg, var(--soft), #f8f1ea);
    padding:12px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    box-sizing:border-box;
    border: 1px solid var(--border);
  }
  .qr-wrap canvas{ display:block; width:96px !important; height:96px !important; }

  .machine-title{
    margin-top:10px;
    font-weight:700;
    font-size:14px;
    color:#3d3530;
    text-align:center;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .machine-meta{
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
    text-align:center;
    font-style: italic;
  }

  .right{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .files-list{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .file{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
    transition: all 0.2s ease;
    font-size:13px;
    color:#3d3530;
    background: rgba(212, 132, 92, 0.03);
  }
  .file small{
    color:var(--muted);
    font-size:11px;
  }
  .file:hover{
    background: rgba(212, 132, 92, 0.08);
    padding-left: 14px;
  }
  .file a{
    color:inherit;
    text-decoration:none;
    font-weight: 500;
  }
  .file a:hover {
    color: var(--accent);
  }
  .file .icon{
    width:36px;
    height:36px;
    border-radius:8px;
    background: linear-gradient(135deg, rgba(212, 132, 92, 0.12), rgba(212, 132, 92, 0.06));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-weight:700;
    font-size:14px;
    flex-shrink:0;
    border: 1px solid rgba(212, 132, 92, 0.15);
  }

  footer{
    margin-top:32px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* Print CSS - Optimisé pour PDF */
  @media print {
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: auto; }
    .page { max-width: 100%; margin: 0; padding: 10mm; }
    header, .actions, footer { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8mm; page-break-inside: avoid; }
    .machine { 
      page-break-inside: avoid;
      box-shadow: none; 
      border: 0.5mm solid #e8ddd2;
      padding: 5mm;
      margin: 0;
      height: auto;
      break-inside: avoid;
    }
    .left { width: 35mm; }
    .qr-wrap { padding: 3mm; }
    .qr-wrap canvas { width: 30mm !important; height: 30mm !important; }
  }

  /* small util */
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>🔧 QR Codes Machines</h1>
        <div class="subtitle">Cartes imprimables — Embouteillage Ligne A</div>
      </div>
      <div class="actions">
        <button id="exportPDF" class="btn">📄 Exporter en PDF</button>
        <button id="regenerate" class="btn ghost">🔁 Régénérer</button>
      </div>
    </header>

    <main id="container" class="grid" aria-live="polite"></main>

    <footer>
      Généré par <strong>Maintenance-Domagne</strong> — URL: <span class="muted">https://maintenance-domagne.github.io/qr_code_plan/</span>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
  // === Données complètes ===
  const machinesData = {
    "depalettiseur": {
        "label": "1- Dépalettiseur",
        "Schéma_électrique": [
      {
        "name": "Schéma électrique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Schéma_électrique/B_C22077ABE_15-03-2024_SB - SCHÉMAS ÉLECTRIQUE.pdf"
      }
    ],
    "Schéma_pneumatique": [
      {
        "name": "Schéma pneumatique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Schéma_pneumatique/C_C22077ABE - SCHEMA PNEUMATIQUE.pdf"
      }
    ],
    "Guide_technique_et_plans_mécanique": [
      {
        "name": "Manuel d'entretien et plan mécanique",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Plans_mécanique/Plan mecanique.pdf"
      }
    ],
    "Liste de pièces machine": [
      {
        "name": "Pieces détachées en stock",
        "file": "Embouteillage_ligne_A/1- Dépalettiseur/Liste_pièces/EXPORT_PIECE_MASPACK.pdf"
      }
    ]
    },
    "decaisseuse": {
        "label": "2- Décaisseuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/2- Décaisseuse/Schéma_électrique/Schéma électrique décaisseuse.pdf"
        }]
    },
    "laveuse": {
        "label": "4- Laveuse",
        "Schéma_électrique_p1_69": [{
            "name": "Schéma électrique page 1 à 69",
            "file": "Embouteillage_ligne_A/4- Laveuse/Schéma_électrique/Schéma électrique page 1-69.pdf"
        }],
        "Schéma_électrique_p70_140": [{
            "name": "Schéma électrique page 70 à 140",
            "file": "Embouteillage_ligne_A/4- Laveuse/Schéma_électrique/Schéma électrique page 70-140.pdf"
        }]
    },
    "rinceuse": {
        "label": "6- Rinçeuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/6- Rinçeuse/Schéma_électrique/Plan élec Rinceuse 2015pdf.pdf"
        }]
    },
    "soutireuse": {
        "label": "7- Soutireuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/7- Soutireuse/Schéma_électrique/Schéma électrique soutireuse.pdf"
        }]
    },
    "boucheuse": {
        "label": "9- Boucheuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique boucheuse",
            "file": "Embouteillage_ligne_A/9- Boucheuse/Schéma_électrique/Schéma électrique boucheuse.pdf"
        }]
    },
    "visseuse_alu": {
        "label": "10- Visseuse alu",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/10- Visseuse alu/Schéma_électrique/Schéma électrique Visseuse alu.pdf"
        }]
    },
    "museleuse": {
        "label": "11- Museleuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/11- Museleuse/Schéma_électrique/Schéma électrique museleuse.pdf"
        }]
    },
    "encaisseuse": {
        "label": "16- Encaisseuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/16- Encaisseuse/Schéma_électrique/ECLOR_ENCAISSEUSE BOUTEILLES_IND01.pdf"
        }]
    },
    "encartonneuse": {
        "label": "19- Encartonneuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/19- Encartonneuse/Schéma_électrique/Schéma électrique OCME.pdf"
        }]
    },
    "palettiseur": {
        "label": "21- Palettiseur",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/21- Palettiseur/Schéma_électrique/Schéma élec.pdf"
        }]
    },
    "filmeuse": {
        "label": "22- Filmeuse",
        "Schéma_électrique": [{
            "name": "Schéma électrique",
            "file": "Embouteillage_ligne_A/22- Filmeuse/Schéma_électrique/Schéma électrique filmeuse.pdf"
        }]
    }
  };

  // Générer QR asynchrone
  function generateQRCode(container, text, size = 96) {
    return new Promise((resolve) => {
      container.innerHTML = "";
      const q = new QRCode(container, {
        text: text,
        width: size,
        height: size,
        correctLevel: QRCode.CorrectLevel.M
      });
      setTimeout(() => resolve(q), 200);
    });
  }

  // Affichage
  function displayMachines() {
    const container = document.getElementById("container");
    container.innerHTML = "";
    Object.keys(machinesData).forEach(id => {
      const machine = machinesData[id];
      const machineURL = `https://maintenance-domagne.github.io/qr_code_plan/index.html?machine=${id}`;

      const el = document.createElement("article");
      el.className = "machine";

      const left = document.createElement("div");
      left.className = "left";

      const qrWrap = document.createElement("div");
      qrWrap.className = "qr-wrap";
      left.appendChild(qrWrap);

      const title = document.createElement("div");
      title.className = "machine-title";
      title.textContent = machine.label;
      left.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "machine-meta";
      meta.textContent = id;
      left.appendChild(meta);

      const right = document.createElement("div");
      right.className = "right";

      const filesList = document.createElement("ul");
      filesList.className = "files-list";

      Object.keys(machine).forEach(key => {
        if (key !== "label") {
          machine[key].forEach(item => {
            const li = document.createElement("li");
            const f = document.createElement("div");
            f.className = "file";

            const icon = document.createElement("div");
            icon.className = "icon";
            icon.textContent = (item.name || "?").trim().charAt(0).toUpperCase();

            const info = document.createElement("div");
            const a = document.createElement("a");
            a.href = item.file;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = item.name;

            const small = document.createElement("small");
            small.textContent = item.file;

            info.appendChild(a);
            info.appendChild(document.createElement("div")).appendChild(small);
            info.lastChild.style.marginTop = "4px";
            info.lastChild.style.color = "#7d6d62";
            info.lastChild.style.fontSize = "11px";

            f.appendChild(icon);
            f.appendChild(info);
            li.appendChild(f);
            filesList.appendChild(li);
          });
        }
      });

      right.appendChild(filesList);
      el.appendChild(left);
      el.appendChild(right);
      container.appendChild(el);

      generateQRCode(qrWrap, machineURL, 96).then(() => {
        const u = document.createElement("div");
        u.className = "muted";
        u.style.marginTop = "8px";
        u.style.textAlign = "center";
        u.style.fontSize = "11px";
        u.textContent = new URL(machineURL).pathname + new URLSearchParams(new URL(machineURL).search).toString().replace(/^/, '?');
        left.appendChild(u);
      });
    });
  }

  // Export PDF avec html2pdf
  async function exportToPDF() {
    const element = document.querySelector('.page');
    const opt = {
      margin: [10, 10, 10, 10],
      filename: 'QR_Codes_Machines_Ligne_A.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { 
        scale: 2, 
        logging: false, 
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff'
      },
      jsPDF: { 
        unit: 'mm', 
        format: 'a4', 
        orientation: 'portrait',
        compress: true
      },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    
    // Masquer header et footer temporairement
    const header = document.querySelector('header');
    const footer = document.querySelector('footer');
    header.style.display = 'none';
    footer.style.display = 'none';
    
    try {
      await html2pdf().set(opt).from(element).save();
    } finally {
      // Restaurer l'affichage
      header.style.display = 'flex';
      footer.style.display = 'block';
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    displayMachines();

    document.getElementById("exportPDF").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      const orig = btn.innerHTML;
      btn.textContent = "⏳ Génération...";
      btn.disabled = true;
      
      try {
        await exportToPDF();
        btn.textContent = "✅ PDF prêt";
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 2000);
      } catch (err) {
        console.error("Erreur PDF:", err);
        btn.textContent = "❌ Erreur";
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 2000);
      }
    });

    document.getElementById("regenerate").addEventListener("click", () => {
      displayMachines();
    });
  });
  </script>
</body>
</html>
