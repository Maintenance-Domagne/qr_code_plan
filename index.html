<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Documentation Technique - Ligne A</title>

<link href="httpsr:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --vert:#00a884;
    --vert-fonce:#007c65;
    --texte:#243447;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#009879,#006e58);
}

.main{
    position:relative;
    width:100%;
    max-width:1200px;
    padding:35px;
    border-radius:24px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    overflow:hidden;
}

.main::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("Loic_Raison_Degustation_Noir_sans_fond.png");
    background-position:center;
    background-size:cover;
    opacity:0.05;
    pointer-events:none;
}

.main > *{
    position:relative;
    z-index:2;
}

.banner{
    background:#009879;
    color:white;
    text-align:center;
    padding:12px;
    border-radius:12px;
    font-weight:600;
    margin-bottom:25px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    padding-bottom:20px;
    border-bottom:1px solid rgba(0,0,0,.1);
}

h1{
    font-size:2rem;
    color:var(--texte);
}

.machine-label{
    margin-top:10px;
    display:inline-block;
    padding:8px 15px;
    border-radius:20px;
    background:rgba(0,168,132,.15);
    color:var(--vert);
    font-weight:600;
}

.qr{
    padding:15px;
    background:white;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

#content{
    margin-top:30px;
}

section{
    margin-top:30px;
}

h3{
    margin-bottom:15px;
    color:var(--texte);
    font-size:1.15rem;
}

ul{
    list-style:none;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

li{
    background:white;
    border-left:4px solid var(--vert);
    border-radius:14px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

li:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(0,0,0,.15);
}

a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--texte);
    padding:18px;
    font-weight:500;
}

a:hover{
    color:var(--vert);
}

a::before{
    content:"📄";
}

footer{
    text-align:center;
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid rgba(0,0,0,.08);
    color:#64748b;
    font-size:0.9rem;
}

/* Bourdon */

#bee{
    position:absolute;
    width:55px;
    height:55px;
    background-image:url('bee-1979_512.gif');
    background-size:contain;
    background-repeat:no-repeat;
    cursor:pointer;
    z-index:100;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));
}

/* Popup */

#easterEgg{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    z-index:9999;
    max-width:400px;
    width:90%;
}

#closeEgg{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:var(--vert);
    color:white;
    cursor:pointer;
    font-weight:600;
}

#closeEgg:hover{
    background:var(--vert-fonce);
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .main{
        padding:20px;
    }

    header{
        flex-direction:column;
        text-align:center;
    }

    ul{
        grid-template-columns:1fr;
    }

    h1{
        font-size:1.6rem;
    }
}

</style>
</head>

<body>

<div class="main">

    <div class="banner">
        🏭 EMBOUTEILLAGE LIGNE A • PORTAIL DOCUMENTAIRE
    </div>

    <header>
        <div>
            <h1>📄 Documentation Technique</h1>
            <div class="machine-label" id="machineLabel"></div>
        </div>

        <div class="qr" id="qr"></div>
    </header>

    <div id="content">
        <p style="text-align:center;padding:30px;color:#666;">
            ⏳ Chargement de la documentation...
        </p>
    </div>

    <footer>
        Accès Documents • Ligne A • Créé par Christopher OSTER
    </footer>

    <div id="bee"></div>

</div>

<div id="easterEgg">
    <h2>🐝 Le Bourdon</h2>

    <p style="margin-top:15px;">
        Application créée par<br>
        <strong>Christopher OSTER</strong><br>
        Alias <em>"Le Bourdon"</em>
    </p>

    <button id="closeEgg">Fermer</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const content = document.getElementById("content");
const machineLabel = document.getElementById("machineLabel");
const qrDiv = document.getElementById("qr");

const params = new URLSearchParams(window.location.search);
const machineId = params.get("machine");

fetch("./data.json")
.then(res => res.json())
.then(data => {

    if (!machineId || !data[machineId]) {
        content.innerHTML = "<p>❌ Machine inconnue</p>";
        return;
    }

    const machine = data[machineId];

    machineLabel.textContent = machine.label;

    new QRCode(qrDiv,{
        text:window.location.href,
        width:120,
        height:120
    });

    content.innerHTML = "";

    for(const folder in machine){

        if(folder === "label") continue;

        const section = document.createElement("section");

        section.innerHTML = `
            <h3>${folder.replaceAll("_"," ")}</h3>
        `;

        const ul = document.createElement("ul");

        machine[folder].forEach(item => {

            const li = document.createElement("li");

            li.innerHTML = `
                ${item.file}
                    ${item.name}
                </a>
            `;

            ul.appendChild(li);

        });

        section.appendChild(ul);
        content.appendChild(section);
    }

})
.catch(err=>{
    console.error(err);
    content.innerHTML = "<p>❌ Erreur de chargement</p>";
});

/* Bourdon */

const bee = document.getElementById('bee');
const main = document.querySelector('.main');

let beeX = 10;
let beeY = 10;

let targetX = 0;
let targetY = 0;

const beeSpeed = 0.10;

function pickTarget(){

    const rect = main.getBoundingClientRect();

    targetX = Math.random() * (rect.width - 60);
    targetY = Math.random() * (rect.height - 60);

}

function animateBee(){

    beeX += (targetX-beeX)*beeSpeed;
    beeY += (targetY-beeY)*beeSpeed;

    const oscillation = Math.sin(Date.now()/200)*5;

    bee.style.transform =
        `translate(${beeX}px,${beeY+oscillation}px)`;

    if(
        Math.abs(targetX-beeX) < 1 &&
        Math.abs(targetY-beeY) < 1
    ){
        pickTarget();
    }

    requestAnimationFrame(animateBee);
}

pickTarget();
animateBee();

/* Easter Egg */

const egg = document.getElementById('easterEgg');
const closeEgg = document.getElementById('closeEgg');

bee.addEventListener('click',()=>{
    egg.style.display='block';
});

closeEgg.addEventListener('click',()=>{
    egg.style.display='none';
});

</script>

</body>
</html>
